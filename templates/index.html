<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #24243a;
            --surface: #1e1e2e;
            --surface-hover: #2a2a3e;
            --accent: #7c5bf5;
            --accent-glow: rgba(124, 91, 245, 0.25);
            --accent-light: #a78bfa;
            --text-primary: #e8e6f0;
            --text-secondary: #9994b8;
            --text-muted: #6b6588;
            --border: rgba(124, 91, 245, 0.15);
            --user-bubble: linear-gradient(135deg, #7c5bf5, #6341d4);
            --bot-bubble: #1e1e2e;
            --error: #f5465b;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 28px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: var(--user-bubble);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .header-info h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Chat area ── */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        /* ── Messages ── */
        .message {
            display: flex;
            gap: 12px;
            max-width: 78%;
            animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message.bot .message-avatar {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .message.user .message-avatar {
            background: var(--user-bubble);
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.65;
            font-size: 14px;
            position: relative;
        }

        .message.bot .message-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* ── Typing indicator ── */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 6px 4px;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Welcome screen ── */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            opacity: 0.85;
        }

        .welcome-icon {
            width: 72px;
            height: 72px;
            background: var(--user-bubble);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 40px var(--accent-glow);
            margin-bottom: 8px;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 400px;
            line-height: 1.6;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            max-width: 600px;
        }

        .chip {
            padding: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .chip:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            color: var(--accent-light);
            transform: translateY(-1px);
        }

        /* ── Input area ── */
        .input-area {
            padding: 16px 28px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #question-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
            padding: 8px 0;
        }

        #question-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            width: 40px;
            height: 40px;
            background: var(--user-bubble);
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-icon">📚</div>
        <div class="header-info">
            <h1>RAG Knowledge Assistant</h1>
            <p><span class="status-dot"></span>Powered by LLaMA 3.1 + FAISS</p>
        </div>
    </div>

    <!-- Chat area -->
    <div class="chat-container" id="chat-container">
        <div class="welcome" id="welcome-screen">
            <div class="welcome-icon">🧠</div>
            <h2>Ask your documents anything</h2>
            <p>I can answer questions based on the PDFs loaded in the knowledge base. Ask me about their content!</p>
            <div class="suggestion-chips">
                <button class="chip" onclick="askSuggestion(this)">What documents are in the knowledge base?</button>
                <button class="chip" onclick="askSuggestion(this)">Summarize the main ideas</button>
                <button class="chip" onclick="askSuggestion(this)">What is the key argument?</button>
            </div>
        </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="question-input"
                      placeholder="Ask a question about your documents..."
                      rows="1"
                      onkeydown="handleKeyDown(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()" title="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        <div class="footer-note">Press Enter to send · Shift+Enter for new line</div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        // Auto-resize textarea
        questionInput.addEventListener('input', () => {
            questionInput.style.height = 'auto';
            questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
        });

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function askSuggestion(chip) {
            questionInput.value = chip.textContent;
            sendMessage();
        }

        function addMessage(text, role) {
            // Hide welcome screen on first message
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            const msg = document.createElement('div');
            msg.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';

            // Convert newlines to paragraphs for bot messages
            if (role === 'bot') {
                const paragraphs = text.split('\n').filter(p => p.trim());
                paragraphs.forEach(p => {
                    const el = document.createElement('p');
                    el.textContent = p;
                    content.appendChild(el);
                });
            } else {
                const p = document.createElement('p');
                p.textContent = text;
                content.appendChild(p);
            }

            msg.appendChild(avatar);
            msg.appendChild(content);
            chatContainer.appendChild(msg);
            scrollToBottom();

            return msg;
        }

        function addTypingIndicator() {
            const msg = document.createElement('div');
            msg.className = 'message bot';
            msg.id = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            msg.appendChild(avatar);
            msg.appendChild(content);
            chatContainer.appendChild(msg);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Disable input while processing
            questionInput.value = '';
            questionInput.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(question, 'user');
            addTypingIndicator();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();
                removeTypingIndicator();

                if (data.error) {
                    addMessage(`Error: ${data.error}`, 'bot');
                } else {
                    addMessage(data.answer, 'bot');
                }
            } catch (err) {
                removeTypingIndicator();
                addMessage(`Connection error: ${err.message}`, 'bot');
            }

            sendBtn.disabled = false;
            questionInput.focus();
        }

        // Focus input on load
        questionInput.focus();
    </script>
</body>
</html>
